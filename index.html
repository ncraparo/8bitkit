<style>

*,*::before,*::after{box-sizing:inherit}

.arrow svg{width:18px;height:18px;fill:#d7dae0}
.lcd{flex:1;border-radius:10px;padding:10px 14px 9px;background:#b8c6a2;box-shadow:0 3px 8px rgba(0,0,0,.4) inset,0 0 0 4px #2a2c31;color:#222b1b;text-align:center}

.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,3vw,14px)}
.pad{aspect-ratio:1;border-radius:16px;padding:9px 10px;position:relative;display:flex;align-items:flex-end;font-size:13px;font-weight:600;color:#b4b8c0;background:linear-gradient(#3a3c43,#26282d);box-shadow:0 -4px 0 #17181c inset,0 2px 0 #9ea2a9;cursor:pointer;touch-action:none;transition:box-shadow .06s,background .06s}

.pad.locked.on{box-shadow:0 3px 8px rgba(0,0,0,.35) inset,0 0 26px var(--acc),0 0 0 2px #16171a}
.pad i{position:absolute;top:8px;right:10px;font:600 11px ui-monospace,monospace;font-style:normal;opacity:.55}
.pad .lock{position:absolute;top:8px;left:10px;font:700 10px ui-monospace,monospace;color:var(--acc);letter-spacing:.02em}
.pad.locked.on .lock,.pad.on i{color:#16171a}

function ensure(){
  if(!ctx){
    ctx=new(window.AudioContext||window.webkitAudioContext)();

    master=ctx.createGain();master.connect(comp);comp.connect(ctx.destination);setVol();

  if(ctx.state!=='running')ctx.resume();
}

function T(o,s,ty,f0,f1,sw,pk,dec,d=0){

  g.gain.setValueAtTime(pk,t);g.gain.exponentialRampToValueAtTime(0.001,t+dec);
  os.connect(g);g.connect(o);os.start(t);os.stop(t+dec+0.05);s.push(os);

  g.gain.setValueAtTime(pk,t);g.gain.exponentialRampToValueAtTime(0.001,t+dec);

  kick:(o,s)=>{T(o,s,'sine',70,35,.25,.5,.9);T(o,s,'sine',50,40,.3,.25,1.1)},
  snare:(o,s)=>{N(o,s,'bandpass',1400,.4,.25,.6);T(o,s,'sine',200,160,.2,.15,.5)},
  clap:(o,s)=>{N(o,s,'bandpass',1200,.3,.2,.5);N(o,s,'bandpass',2000,.4,.1,.55,.04)},
  hhc:(o,s)=>N(o,s,'bandpass',7000,.4,.12,.12),
  hho:(o,s)=>N(o,s,'bandpass',6500,.35,.12,.8),
  tom1:(o,s)=>{T(o,s,'sine',180,100,.3,.4,.9);N(o,s,'lowpass',600,1,.08,.1)},
  tom2:(o,s)=>{T(o,s,'sine',120,70,.35,.4,1);N(o,s,'lowpass',450,1,.08,.12)},
  crash:(o,s)=>{N(o,s,'bandpass',4000,.3,.2,2.5);N(o,s,'highpass',6000,.5,.1,2.8)},
  ride:(o,s)=>{N(o,s,'bandpass',5000,.5,.12,1.8);[1800,2700,3900].forEach(f=>T(o,s,'sine',f,f,.2,.03,1.6))}}}
];

/* voices: hold while pressed; locked pads fire one-shots on the grid */
function stopVoice(v){
  if(v.dead)return;v.dead=true;
  const t=ctx.currentTime;
  v.o.gain.cancelScheduledValues(t);v.o.gain.setValueAtTime(Math.max(v.o.gain.value,.001),t);v.o.gain.linearRampToValueAtTime(0,t+0.012);
  v.s.forEach(x=>{try{x.stop(t+0.02)}catch(e){}});
}
function trigger(id){
  ensure();
  if(voices[id])return;
  if(id==='hhc'&&voices.hho){stopVoice(voices.hho);delete voices.hho}
  const o=ctx.createGain(),s=[];o.connect(master);
  KITS[kit].k[id](o,s);
  voices[id]={o,s,t0:ctx.currentTime};
}
function release(id){
  const v=voices[id];if(!v)return;delete voices[id];
  const wait=Math.max(0,MIN_HOLD-(ctx.currentTime-v.t0));
  setTimeout(()=>stopVoice(v),wait*1000);
}
function fire(id){
  ensure();
  if(id==='hhc'&&voices.hho){stopVoice(voices.hho);delete voices.hho}
  const o=ctx.createGain(),s=[];o.connect(master);
  KITS[kit].k[id](o,s);
  const flash=els[id];
  if(flash){flash.el.classList.add('on');clearTimeout(flash.flashT);flash.flashT=setTimeout(()=>{if(!flash.held)flash.el.classList.remove('on')},70)}
  setTimeout(()=>{
    s.forEach(x=>{try{x.stop()}catch(e){}});
    try{o.disconnect()}catch(e){}
  },2800);
}

/* lock / transport */
function anyLocked(){return Object.keys(locks).length>0}
function startSched(){
  if(schedTimer)return;
  ensure();
  schedTimer=setInterval(schedule,TIMER_MS);
}
function stopSched(){
  if(!schedTimer)return;
  clearInterval(schedTimer);schedTimer=null;
}
function nextHitTime(divId,from){
  const step=beatSec()*divBeats(divId);
  const elapsed=Math.max(0,from-transportStart);
  return transportStart+Math.ceil((elapsed+0.0001)/step)*step;
}
function schedule(){
  if(!ctx||!anyLocked()){stopSched();return}
  const horizon=ctx.currentTime+LOOKAHEAD;
  for(const id of Object.keys(locks)){
    const L=locks[id];
    while(L.next<=horizon){
      if(L.next>=ctx.currentTime-0.02)fire(id);
      L.next+=beatSec()*divBeats(L.div);
    }
  }
}
function setLock(id,divId){
  ensure();
  if(!transportStart)transportStart=ctx.currentTime;
  locks[id]={div:divId,next:nextHitTime(divId,ctx.currentTime)};
  els[id].el.classList.add('locked');
  els[id].lockBadge.textContent=divId;
  startSched();
  fire(id);
}
function clearLock(id){
  delete locks[id];
  els[id].el.classList.remove('locked');
  els[id].lockBadge.textContent='';
  if(!anyLocked())stopSched();
}
function toggleLock(id){
  if(locks[id])clearLock(id);
  else setLock(id,DIVS[divIdx].id);
}
function rephaseLocks(){
  if(!ctx||!anyLocked())return;
  const now=ctx.currentTime;
  for(const id of Object.keys(locks))locks[id].next=nextHitTime(locks[id].div,now);
}
function setBpm(v){
  bpm=Math.min(300,Math.max(40,v|0));
  $('#bpm').textContent=bpm+' BPM';
  rephaseLocks();
}

/* pads */
const PADS=[['crash','Crash','Q'],['ride','Ride','W'],['clap','Clap','E'],
            ['tom1','Tom 1','A'],['tom2','Tom 2','S'],['hho','Hi-hat open','D'],
            ['kick','Kick','Z'],['snare','Snare','X'],['hhc','Hi-hat closed','C']];
const els={},keys={};
PADS.forEach(([id,label,key])=>{
  const el=document.createElement('div');
  el.className='pad';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',label);
  el.innerHTML='<span class="lock" aria-hidden="true"></span>'+label+'<i>'+key+'</i>';
  const lockBadge=el.querySelector('.lock');
  let holdTimer=null,lockedThisPress=false,held=false;
  const down=()=>{
    ensure();held=true;lockedThisPress=false;el.classList.add('on');
    if(armLock){
      lockedThisPress=true;
      if(locks[id])clearLock(id);
      else setLock(id,DIVS[divIdx].id);
      return;
    }
    if(locks[id]){clearLock(id);return}
    trigger(id);
    clearTimeout(holdTimer);
    holdTimer=setTimeout(()=>{lockedThisPress=true;release(id);setLock(id,DIVS[divIdx].id)},HOLD_LOCK_MS);
  };
  const up=()=>{
    held=false;clearTimeout(holdTimer);holdTimer=null;
    if(locks[id]){if(!lockedThisPress)el.classList.remove('on');return}
    el.classList.remove('on');release(id);
  };
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}down()});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up));
  el.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();down()}});
  el.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')up()});
  els[id]={el,down,up,lockBadge,get held(){return held},flashT:0};keys[key.toLowerCase()]=id;
  $('#pads').appendChild(el);
});
function $(s){return document.querySelector(s)}

/* division selector + lock arm */
DIVS.forEach((d,i)=>{
  const b=document.createElement('button');
  b.className='div'+(i===divIdx?' on':'');
  b.type='button';b.textContent=d.label;b.setAttribute('aria-pressed',i===divIdx?'true':'false');
  b.addEventListener('click',()=>{
    divIdx=i;
    [...$('#divs').querySelectorAll('.div')].forEach((el,j)=>{el.classList.toggle('on',j===i);el.setAttribute('aria-pressed',j===i?'true':'false')});
  });
  $('#divs').appendChild(b);
});
const armBtn=document.createElement('button');
armBtn.className='arm';armBtn.type='button';armBtn.id='arm';armBtn.textContent='LOCK';
armBtn.setAttribute('aria-pressed','false');armBtn.title='Arm lock: tap pads to lock/unlock';
armBtn.addEventListener('click',()=>{
  armLock=!armLock;
  armBtn.classList.toggle('on',armLock);
  armBtn.setAttribute('aria-pressed',armLock?'true':'false');
});
$('#divs').appendChild(armBtn);

/* kit selector */
function setKit(n){
  PADS.forEach(([id])=>{
    if(!locks[id]){release(id);els[id].el.classList.remove('on')}
  });
  Object.keys(voices).forEach(id=>{stopVoice(voices[id]);delete voices[id]});
  kit=(n+KITS.length)%KITS.length;
  $('#num').textContent=String(kit+1).padStart(2,'0');
  $('#kname').textContent=KITS[kit].name;
  document.documentElement.style.setProperty('--acc',KITS[kit].acc);
}
$('#prev').addEventListener('click',()=>setKit(kit-1));
$('#next').addEventListener('click',()=>setKit(kit+1));
$('#vol').addEventListener('input',setVol);
$('#bpmDown').addEventListener('click',()=>setBpm(bpm-1));
$('#bpmUp').addEventListener('click',()=>setBpm(bpm+1));
let bpmTap=null;
$('#bpmDown').addEventListener('pointerdown',()=>{clearInterval(bpmTap);bpmTap=setInterval(()=>setBpm(bpm-1),90)});
$('#bpmUp').addEventListener('pointerdown',()=>{clearInterval(bpmTap);bpmTap=setInterval(()=>setBpm(bpm+1),90)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>{
  $('#bpmDown').addEventListener(ev,()=>clearInterval(bpmTap));
  $('#bpmUp').addEventListener(ev,()=>clearInterval(bpmTap));
});

/* computer keyboard */
addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowLeft'&&document.activeElement.id!=='vol')return setKit(kit-1);
  if(e.key==='ArrowRight'&&document.activeElement.id!=='vol')return setKit(kit+1);
  if(e.key==='['||e.key===',')return setBpm(bpm-1);
  if(e.key===']'||e.key==='.')return setBpm(bpm+1);
  if(e.key>='1'&&e.key<='6'){
    divIdx=+e.key-1;
    [...$('#divs').querySelectorAll('.div')].forEach((el,j)=>{el.classList.toggle('on',j===divIdx);el.setAttribute('aria-pressed',j===divIdx?'true':'false')});
    return;
  }
  if(e.key==='l'||e.key==='L'){
    armLock=!armLock;
    const arm=$('#arm');arm.classList.toggle('on',armLock);arm.setAttribute('aria-pressed',armLock?'true':'false');
    return;
  }
  const id=keys[e.key.toLowerCase()];
  if(!id)return;
  if(e.shiftKey)return toggleLock(id);
  els[id].down();
});
addEventListener('keyup',e=>{
  if(e.shiftKey)return;
  const id=keys[e.key.toLowerCase()];if(id)els[id].up();
});
function releaseAll(){
  PADS.forEach(([id])=>{
    if(!locks[id])els[id].up();
  });
}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
$('#dev').addEventListener('contextmenu',e=>e.preventDefault());
</script>
